# Fabrique l'APK de démo Android sur les serveurs de GitHub, à chaque envoi de code.
# Lien de téléchargement fixe : https://github.com/<utilisateur>/<dépôt>/releases/download/demo/ProutMap-demo.apk
name: APK démo Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_DEMO: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Installer les modules
        run: npm ci

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk ProutMap-demo.apk

      - name: Publier le lien de téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo
          name: Prout Map — démo Android
          body: |
            Version démo de Prout Map (sans compte, avec 3 faux amis).
            Sur Android : télécharge ProutMap-demo.apk, ouvre-le et autorise l'installation.
          files: ProutMap-demo.apk
          make_latest: true
