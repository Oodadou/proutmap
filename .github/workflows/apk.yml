name: APK demo Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_DEMO: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le projet
        run: unzip -q proutmap-github.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Installer les modules
        working-directory: proutmap-github
        run: npm ci

      - name: Generer le projet Android
        working-directory: proutmap-github
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compiler l'APK
        working-directory: proutmap-github/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renommer
        run: cp proutmap-github/android/app/build/outputs/apk/release/app-release.apk ProutMap-demo.apk

      - name: Publier le lien de telechargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo
          name: Prout Map demo Android
          body: Version demo de Prout Map. Sur Android, telecharge ProutMap-demo.apk, ouvre-le et autorise l'installation.
          files: ProutMap-demo.apk
          make_latest: true
